name: Atualizar ranking

on:
  schedule:
    # Seg a sex às 21:00 UTC = 18:00 em Brasília, depois do fechamento da B3
    - cron: "0 21 * * 1-5"
  workflow_dispatch:      # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: atualizar-ranking
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar ranking
        run: python gerar_dados.py

      - name: Publicar dados
        run: |
          git config user.name "ranking-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza ranking $(date -u +%F)"
            git push
          fi
